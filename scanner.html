<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Scanner</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-4">

        <h1 class="text-xl font-semibold text-center mb-4">
            Event Check-In
        </h1>

        <div class="bg-gray-800 rounded-xl p-3 shadow-lg">
            <div id="reader" class="w-full rounded-md overflow-hidden"></div>
        </div>

        <div id="result" class="mt-4 text-center text-lg font-medium">
            Ready to scan...
        </div>


        <button onclick="restartScanner()"
            class="mt-4 w-full bg-blue-500 hover:bg-blue-600 py-2 rounded-lg font-medium">
            Scan Next
        </button>

    </div>

    <script>
        const API_URL = "https://event-management-api-95f8.onrender.com/api/admin/attendance/scan";
        let html5QrCode;
        let isProcessing = false; 

        function setResult(message, type = "info") {
            const resultEl = document.getElementById("result");
            resultEl.innerHTML = message;
            const colors = {
                success: "text-green-400",
                error: "text-red-400",
                info: "text-gray-300"
            };
            resultEl.className = `mt-4 text-lg font-medium text-center ${colors[type] || colors.info}`;
        }

        async function startScanner() {
            try {
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                }

                if (!html5QrCode.isScanning) {
                    await html5QrCode.start(
                        { facingMode: "environment" },
                        { fps: 10, qrbox: { width: 250, height: 250 } },
                        onScanSuccess
                    );
                }
            } catch (err) {
                console.error("Scanner Start Error:", err);
                setResult("Camera access denied", "error");
            }
        }

        async function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;

            setResult("Processing..."); 

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include", 
                    body: JSON.stringify({ qrToken: decodedText })
                });

                const data = await res.json();

                if (!res.ok) throw new Error(data.error || data.message || "Scan failed");

                setResult(data.message || "Check-in Successful!", "success");

            } catch (err) {
                setResult(err.message || "Server error", "error");
            } finally {
                setTimeout(() => {
                    isProcessing = false;
                    setResult("Ready to scan...");
                }, 3000);
            }
        }

        async function restartScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                await html5QrCode.stop();
            }
            isProcessing = false;
            setResult("Ready to scan...");
            startScanner();
        }

        window.addEventListener('DOMContentLoaded', startScanner);
    </script>

</body>

</html>
